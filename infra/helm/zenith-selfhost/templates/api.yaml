{{- $s := .Values.secrets.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith-api
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: zenith-api}
  template:
    metadata:
      labels: {app: zenith-api}
    spec:
      serviceAccountName: zenith-api
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: ZENITH_MODE, value: standalone}
            - {name: K8S_MODE, value: real}
            - {name: ENVIRONMENT, value: production}
            - {name: ZENITH_TLS_ISSUER, value: {{ .Values.tls.issuerName | quote }}}
            - {name: ZENITH_APP_CERTS, value: {{ .Values.tls.appCerts | quote }}}
{{- if .Values.tls.caSecret }}
            - {name: ZENITH_TLS_CA_FILE, value: /etc/zenith-ca/ca.crt}
{{- end }}
            - {name: BASE_DOMAIN, value: {{ required "domain is required" .Values.domain | quote }}}
            - {name: CORS_ORIGINS, value: {{ printf "https://%s" .Values.domain | quote }}}
            - name: DB_URI
              valueFrom: {secretKeyRef: {name: zenith-postgres-app, key: uri}}
            - {name: DATABASE_URL, value: "$(DB_URI)?sslmode=require"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: jwt-secret}}
            - name: ADMIN_EMAIL
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: admin-email}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: admin-password}}
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: secrets-encryption-key}}
            - {name: S3_ENDPOINT, value: "http://zenith-storage:9000"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: s3-access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ $s }}, key: s3-secret-key}}
            - {name: S3_REGION, value: us-east-1}
            {{- if .Values.storage.publicHost }}
            - {name: S3_PUBLIC_ENDPOINT, value: "https://{{ .Values.storage.publicHost }}"}
            {{- end }}
            - {name: S3_PLATFORM_BUCKET, value: {{ .Values.storage.platformBucket | quote }}}
{{- if .Values.tls.caSecret }}
          volumeMounts:
            - {name: tls-ca, mountPath: /etc/zenith-ca, readOnly: true}
{{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- if .Values.tls.caSecret }}
      volumes:
        - name: tls-ca
          secret: {secretName: {{ .Values.tls.caSecret | quote }}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: zenith-api
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
spec:
  selector: {app: zenith-api}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
