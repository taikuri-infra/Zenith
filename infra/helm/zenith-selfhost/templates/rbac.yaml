apiVersion: v1
kind: ServiceAccount
metadata:
  name: zenith-api
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zenith-api
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/log, pods/exec, services, endpoints, secrets, configmaps, resourcequotas, limitranges, persistentvolumeclaims, events]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: ["*"]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers, clusterissuers]
    verbs: ["*"]
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [zenith.dev]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zenith-api
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zenith-api
subjects:
  - kind: ServiceAccount
    name: zenith-api
    namespace: {{ .Release.Namespace }}
