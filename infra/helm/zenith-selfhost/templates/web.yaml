apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith-web
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: zenith-web}
  template:
    metadata:
      labels: {app: zenith-web}
    spec:
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NEXT_PUBLIC_ZENITH_MODE, value: standalone}
            - {name: NEXT_PUBLIC_API_URL, value: ""}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zenith-web
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
spec:
  selector: {app: zenith-web}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
