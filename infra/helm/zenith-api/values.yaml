namespace: zenith-platform
replicas: 1
image: zenith-api:latest
imageRegistry: ""
imagePullPolicy: Never
imagePullSecret: ""
port: 8080
metricsPort: 9090

env:
  CORS_ORIGINS: ""

ingress:
  host: api.freezenith.com
  tlsSecret: freezenith-tls
  apisixEnabled: false
  # Admin key for the in-cluster APISIX admin API (upstream-sync CronJob).
  # Empty = fall back to APISIX's built-in default key. Override per environment.
  apisixAdminKey: ""

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 250m
