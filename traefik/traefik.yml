# Default Traefik static config for a manual `docker compose up`.
#
# `zen install --edition compose` OVERWRITES this file for HTTP-01 or DNS-01.
# Self-signed installs (both installers) leave it alone and write the git-ignored
# traefik.selfsigned.yml instead, selected by ZENITH_TRAEFIK_CONFIG in .env.
# If you run the stack by hand, set your email below and make sure DNS points
# at this box on ports 80/443.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
providers:
  docker:
    exposedByDefault: false
    network: zenith_default
  file:
    directory: /etc/traefik/dynamic
    watch: true
certificatesResolvers:
  le:
    acme:
      email: ""
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
