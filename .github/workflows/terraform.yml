name: Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
  TF_VAR_registry_host: ${{ secrets.HARBOR_HOST }}
  TF_VAR_registry_username: ${{ secrets.HARBOR_ROBOT_USER }}
  TF_VAR_registry_password: ${{ secrets.HARBOR_ROBOT_TOKEN }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
  TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  # Plan runs on PRs and manual plan triggers — always blocking
  terraform-plan:
    name: "Plan"
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [staging, staging-k8s]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
          # Disable the stdout-capturing wrapper: a large plan captured into a
          # step output overflows the process arg/env limit when interpolated
          # into a later step. We capture the plan to a file instead.
          terraform_wrapper: false

      - name: Setup kubeconfig
        if: matrix.dir == 'staging-k8s'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/zenith-staging.yaml

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        # Wrapper disabled: capture output to a file and record the detailed
        # exit code (0 = no changes, 2 = changes, 1 = error). Never let the
        # (potentially huge) plan text reach a later step's arg/env list.
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          # Keep the PR comment under GitHub's ~65 KB limit; the github-script
          # step reads this file directly rather than via interpolation.
          head -c 60000 plan.txt > plan.trunc.txt
          exit 0

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIR: ${{ matrix.dir }}
          CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            let plan = 'No output';
            try {
              plan = fs.readFileSync(`infra/terraform/${process.env.DIR}/plan.trunc.txt`, 'utf8');
            } catch (e) {}
            const body = `### Terraform Plan — \`${process.env.DIR}\`\n\`\`\`\n${plan}\n\`\`\`\n*Exit code: ${process.env.CODE}*`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.substring(0, 65536)
            });

      - name: Fail on plan error
        # Only a real error (exit 1) fails the job; exit 2 just means changes.
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # Apply requires manual approval via environment protection rules
  terraform-apply:
    name: "Apply"
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: staging-terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/zenith-staging.yaml

      # --- Stage 1: Server + DNS ---
      - name: Init staging
        working-directory: infra/terraform/staging
        run: terraform init

      - name: Plan staging
        working-directory: infra/terraform/staging
        run: terraform plan -no-color

      - name: Apply staging
        working-directory: infra/terraform/staging
        run: terraform apply -auto-approve -no-color

      # --- Stage 2: K8s Helm Releases ---
      - name: Init staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform init

      - name: Plan staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform plan -no-color

      - name: Apply staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform apply -auto-approve -no-color
