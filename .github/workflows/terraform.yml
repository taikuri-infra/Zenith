name: Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

# Least privilege by default.
permissions:
  contents: read

jobs:
  # On PRs: fast, secret-free checks only — no plan, no cluster access, no vars.
  # `terraform validate` needs providers but not a backend or variable values,
  # so `init -backend=false` is enough. This keeps infra secrets out of
  # PR-triggered jobs entirely.
  terraform-validate:
    name: "Validate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [staging, staging-k8s]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (providers only, no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate -no-color

  # Plan: manual dispatch only — needs infra secrets + tfvars.
  terraform-plan:
    name: "Plan"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [staging, staging-k8s]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.dir }}
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_registry_host: ${{ secrets.HARBOR_HOST }}
      TF_VAR_registry_username: ${{ secrets.HARBOR_ROBOT_USER }}
      TF_VAR_registry_password: ${{ secrets.HARBOR_ROBOT_TOKEN }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Setup kubeconfig
        if: matrix.dir == 'staging-k8s'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/zenith-staging.yaml

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color

  # Apply: manual dispatch only, gated by environment protection rules.
  terraform-apply:
    name: "Apply"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: staging-terraform
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_registry_host: ${{ secrets.HARBOR_HOST }}
      TF_VAR_registry_username: ${{ secrets.HARBOR_ROBOT_USER }}
      TF_VAR_registry_password: ${{ secrets.HARBOR_ROBOT_TOKEN }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/zenith-staging.yaml

      # --- Stage 1: Server + DNS ---
      - name: Init staging
        working-directory: infra/terraform/staging
        run: terraform init

      - name: Plan staging
        working-directory: infra/terraform/staging
        run: terraform plan -no-color

      - name: Apply staging
        working-directory: infra/terraform/staging
        run: terraform apply -auto-approve -no-color

      # --- Stage 2: K8s Helm Releases ---
      - name: Init staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform init

      - name: Plan staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform plan -no-color

      - name: Apply staging-k8s
        working-directory: infra/terraform/staging-k8s
        run: terraform apply -auto-approve -no-color
