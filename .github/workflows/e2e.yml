name: E2E

# Installs Zenith on a fresh Ubuntu server (Docker-in-Docker) inside the job and
# drives it through the API and the zen CLI: install, deploy + database + custom
# domain + HTTPS, reboot, backup/restore, upgrade from the previous release.
# Runs locally with: act pull_request -W .github/workflows/e2e.yml -j e2e --container-architecture linux/amd64 --privileged
# Under act the artifact upload is skipped; the artifacts stay in infra/e2e/artifacts/ of the job
# workspace (add --bind to the act command to have them land in your checkout on the host).

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'cli/**'
      - 'apps/web/**'
      - 'docker-compose.yml'
      - 'traefik/**'
      - 'infra/scripts/**'
      - 'infra/e2e/**'
      - 'VERSION'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # PRs: a new push supersedes the old run. main: every push is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.arch }})
    # amd64 moves to the owner's self-hosted runner when the repository variable
    # ZENITH_SELF_HOSTED is "true" and the code comes from this repository (never for fork
    # PRs); arm64 always runs on GitHub's native arm runner. Under act, vars is empty.
    # The extra "e2e" label pins the job to ONE runner per machine: two E2E runs on the same
    # Docker daemon would tear each other's servers down (shared network and names).
    runs-on: ${{ (matrix.arch == 'amd64' && vars.ZENITH_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","e2e"]') || matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Skip arm64 under act
        if: ${{ env.ACT && matrix.arch != 'amd64' }}
        run: echo "arm64 is only run on GitHub"
      - uses: actions/checkout@v4
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Run the E2E suite on a fresh server
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        run: bash infra/e2e/run.sh
      - name: Upload artifacts
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.arch }}
          path: infra/e2e/artifacts/**
          if-no-files-found: ignore
