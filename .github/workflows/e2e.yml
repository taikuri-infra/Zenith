name: E2E

# Installs Zenith with `zen install` on a fresh k3d (k3s in Docker) cluster inside the job
# and drives it through the API and the zen CLI: install, deploy + database + custom
# domain + HTTPS, reboot, backup, upgrade, and a restore into a second fresh cluster.
# Runs locally with: bash infra/e2e/run.sh (needs docker, helm and kubectl).

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'cli/**'
      - 'apps/web/**'
      - 'infra/scripts/**'
      - 'infra/helm/**'
      - 'infra/e2e/**'
      - 'VERSION'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # PRs: a new push supersedes the old run. main: every push is checked to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.arch }})
    # amd64 moves to the owner's self-hosted runner when the repository variable
    # ZENITH_SELF_HOSTED_E2E is "true" (separate from ZENITH_SELF_HOSTED: the E2E needs
    # host-to-container networking, which not every self-hosted box has) and the code comes
    # from this repository (never for fork PRs); arm64 always runs on GitHub's native arm
    # runner. Under act, vars is empty.
    # The extra "e2e" label pins the job to ONE runner per machine: two E2E runs on the same
    # Docker daemon would tear each other's servers down (shared network and names).
    runs-on: ${{ (matrix.arch == 'amd64' && vars.ZENITH_SELF_HOSTED_E2E == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","e2e"]') || matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Skip arm64 under act
        if: ${{ env.ACT && matrix.arch != 'amd64' }}
        run: echo "arm64 is only run on GitHub"
      - uses: actions/checkout@v4
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Run the E2E suite on fresh k3d clusters
        if: ${{ !(env.ACT && matrix.arch != 'amd64') }}
        run: bash infra/e2e/run.sh
      - name: Reclaim Docker space (persistent runners)
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          docker image prune -f >/dev/null
          docker builder prune -f --keep-storage 2GB >/dev/null
      - name: Upload artifacts
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.arch }}
          path: infra/e2e/artifacts/**
          if-no-files-found: ignore
