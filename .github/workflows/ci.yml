name: CI

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:  # allows running via act locally

jobs:
  # =========================================================================
  # Tests: Go + Node.js + Helm
  # =========================================================================
  test:
    name: Run Tests
    # Runs on the owner's self-hosted runner when the repository variable ZENITH_SELF_HOSTED
    # is "true" and the code comes from this repository (never for fork PRs); otherwise on
    # GitHub-hosted ubuntu-latest. See docs/ci-cd-pipelines.md "Self-hosted runner".
    runs-on: ${{ fromJSON((vars.ZENITH_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Run install script tests
        run: |
          bash infra/scripts/install_test.sh
          bash infra/scripts/compose_networks_test.sh
          bash infra/e2e/server_test.sh

      - name: Run API tests
        run: cd services/api && go test ./... -race -count=1

      - name: Run CLI tests
        run: cd services/cli && go test ./... -race -count=1

      - name: Build CLI
        run: cd services/cli && go build -o /dev/null ./cmd/zenith/

      - name: Test zen CLI (cli/)
        run: cd cli && go test ./... -race -count=1

      - name: Vet E2E suite (cli/e2e)
        run: cd cli && go vet -tags e2e ./e2e/

      - name: Build zen CLI (cli/)
        run: cd cli && go build -o /dev/null .

      - name: Run Terraform Provider tests
        run: cd services/terraform-provider-zenith && go test ./... -race -count=1

      - name: Build Terraform Provider
        run: cd services/terraform-provider-zenith && go build -o /dev/null .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm turbo lint

      - name: Typecheck frontend
        run: pnpm --filter @zenith/web exec tsc --noEmit

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm charts
        run: |
          for chart in infra/helm/zenith-api infra/helm/zenith-web infra/helm/zenith-mc infra/helm/zenith-landing infra/helm/zenith-operator infra/helm/zenith-demo infra/helm/zenith-tenant; do
            echo "Linting $chart..."
            helm lint "$chart" --strict || exit 1
          done

  # =========================================================================
  # Security: Semgrep SAST
  # =========================================================================
  security:
    name: Semgrep SAST
    runs-on: ${{ fromJSON((vars.ZENITH_SELF_HOSTED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64"]' || '"ubuntu-latest"') }}
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --config .semgrep.yml --error .
        env:
          SEMGREP_RULES: >-
            p/default
            p/golang
            p/typescript
            p/nextjs
            p/docker
            p/kubernetes
            p/secrets
            p/owasp-top-ten

  # =========================================================================
  # Commitlint: validate conventional commit messages
  # =========================================================================
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
