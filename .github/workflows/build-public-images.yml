name: Build & Push Public Self-Host Images

# Publishes the self-hostable FreeZenith images to the PUBLIC GitHub Container
# Registry (ghcr.io) so anyone can `docker compose up` without registry auth.
# This is separate from build-images.yml, which pushes to the private Harbor
# for the SaaS/staging cluster. Self-hosters pull from GHCR; the SaaS cluster
# pulls from Harbor.
#
# Dormant by design: runs only on manual dispatch or a published release —
# committing this file does not push anything.
#
# Each architecture is built natively (amd64 on ubuntu-latest or the owner's
# self-hosted runner, arm64 on GitHub's arm runner) and pushed by digest; a final
# job merges the two digests into one multi-arch tag. No QEMU emulation: the
# arm64 web build took 15–60 min emulated and takes ~3 min natively.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 0.9.0 or latest). :latest is pushed only for the tag latest or a final (non-prerelease) release.'
        required: true
        default: 'latest'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      latest: ${{ steps.tag.outputs.latest }}
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          # Strip a leading v (v0.9.0 -> 0.9.0)
          TAG="${TAG#v}"
          # Validate: allow only semver-ish tags or 'latest' — reject anything else
          if ! printf '%s' "$TAG" | grep -qE '^([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*|latest)$'; then
            echo "Refusing unsafe/unexpected tag: '$TAG'" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ] && [ "$TAG" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Release tag '$TAG' does not match VERSION '$(cat VERSION)'" >&2
            exit 1
          fi
          LATEST=false
          if [ "$EVENT_NAME" = "release" ]; then
            [ "$IS_PRERELEASE" = "false" ] && LATEST=true
          elif [ "$TAG" = "latest" ]; then
            LATEST=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    # amd64 on the owner's self-hosted runner when ZENITH_SELF_HOSTED is "true" (release and
    # dispatch events only run from this repository, so no fork guard is needed here);
    # arm64 always on GitHub's native arm runner.
    runs-on: ${{ (matrix.arch == 'amd64' && vars.ZENITH_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","x64"]') || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [zenith-api, zenith-web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: zenith-api
            dockerfile: services/api/Dockerfile
            build_args: ""
          - image: zenith-web
            dockerfile: apps/web/Dockerfile
            # Self-host defaults; the web entrypoint.sh overrides NEXT_PUBLIC_*
            # at runtime, so these are only fallbacks.
            build_args: |
              NEXT_PUBLIC_ZENITH_MODE=standalone
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror build args (restricted networks)
        # A self-hosted runner behind a blocked Go proxy / npm registry sets GOPROXY,
        # GOSUMDB, npm_config_registry or COREPACK_NPM_REGISTRY in its .env; the
        # Dockerfiles declare them as ARGs. Unset ones are not passed.
        id: mirrors
        run: |
          {
            echo 'args<<EOT'
            for v in GOPROXY GOSUMDB npm_config_registry COREPACK_NPM_REGISTRY; do
              if [ -n "${!v:-}" ]; then echo "$v=${!v}"; fi
            done
            echo 'EOT'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.image }} (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            ${{ matrix.build_args }}
            ${{ steps.mirrors.outputs.args }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Untagged push: the merge job attaches the tags to the manifest list.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.image }} manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [zenith-api, zenith-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -eu
          n=$(ls | wc -l)
          if [ "$n" != 2 ]; then echo "expected 2 digests (amd64, arm64), got $n" >&2; exit 1; fi
          tags=(-t "$IMAGE:$TAG")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          # shellcheck disable=SC2046
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
